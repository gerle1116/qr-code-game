name: Restore image system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-image-system.yml'

permissions:
  contents: write

jobs:
  restore-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current categorized app
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          required = [
              'function showThingsIKnow()',
              'function debugMenuButton(',
              'function showDebugEncounters()',
          ]
          missing = [x for x in required if x not in app]
          if missing:
              raise SystemExit(f'Refusing to patch: categorized app markers missing: {missing}')

          helper = "\n".join([
              '  function getPagePicture(page, context) {',
              '    const specific =',
              '      page &&',
              '      typeof page.picture === "string" &&',
              '      page.picture.trim()',
              '        ? page.picture.trim()',
              '        : null;',
              '',
              '    if (specific) {',
              '      return specific;',
              '    }',
              '',
              '    if (context && context.type === "encounter") {',
              '      const encounter =',
              '        GAME.encounters &&',
              '        GAME.encounters[context.encounterId];',
              '',
              '      if (',
              '        encounter &&',
              '        typeof encounter.defaultPicture === "string" &&',
              '        encounter.defaultPicture.trim()',
              '      ) {',
              '        return encounter.defaultPicture.trim();',
              '      }',
              '    }',
              '',
              '    if (context && context.type === "item") {',
              '      const item =',
              '        GAME.items &&',
              '        GAME.items[context.itemName];',
              '',
              '      if (',
              '        item &&',
              '        typeof item.defaultPicture === "string" &&',
              '        item.defaultPicture.trim()',
              '      ) {',
              '        return item.defaultPicture.trim();',
              '      }',
              '    }',
              '',
              '    return null;',
              '  }',
              '',
              '',
          ])

          if 'function getPagePicture(page, context)' not in app:
              show_start = app.index('  function showPage(pageId)')
              app = app[:show_start] + helper + app[show_start:]

          show_start = app.index('  function showPage(pageId)')
          button_conditions = app.index('function checkButtonCondition', show_start)
          section = app[show_start:button_conditions]

          if 'const pictureMarkup' not in section:
              shell_pos = app.index('    shell(`', show_start)
              picture_builder = "\n".join([
                  '    const picture =',
                  '      getPagePicture(page, context);',
                  '',
                  '    const pictureMarkup =',
                  '      picture',
                  '        ? `',
                  '          <div class="encounter-picture">',
                  '            <img',
                  '              src="./images/${esc(picture)}.png"',
                  '              alt="${esc(page.speaker || TEXT.encounterFallback)}"',
                  '              class="encounter-picture-image"',
                  '              decoding="async"',
                  '            >',
                  '          </div>',
                  '        `',
                  '        : "";',
                  '',
                  '',
              ])
              app = app[:shell_pos] + picture_builder + app[shell_pos:]

          show_start = app.index('  function showPage(pageId)')
          button_conditions = app.index('function checkButtonCondition', show_start)
          section = app[show_start:button_conditions]

          if '${pictureMarkup}' not in section:
              controls_pos = app.index('        ${controls}\n', show_start)
              insert_at = controls_pos + len('        ${controls}\n')
              app = app[:insert_at] + '        ${pictureMarkup}\n' + app[insert_at:]

          show_start = app.index('  function showPage(pageId)')
          button_conditions = app.index('function checkButtonCondition', show_start)
          section = app[show_start:button_conditions]

          if 'pictureImage.onerror' not in section:
              controls_pos = app.index('        ${pictureMarkup}\n', show_start)
              post_if = app.index('    if (dropdown) {', controls_pos)
              handler = "\n".join([
                  '    const pictureImage =',
                  '      document.querySelector(',
                  '        ".encounter-picture-image"',
                  '      );',
                  '',
                  '    if (pictureImage) {',
                  '      pictureImage.onerror = () => {',
                  '        const wrapper =',
                  '          pictureImage.closest(',
                  '            ".encounter-picture"',
                  '          );',
                  '',
                  '        if (wrapper) {',
                  '          wrapper.remove();',
                  '        }',
                  '      };',
                  '    }',
                  '',
                  '',
              ])
              app = app[:post_if] + handler + app[post_if:]

          app_path.write_text(app, encoding='utf-8')

          encounter_pictures = {
              '01': 'child',
              '02': 'merchant',
              '03': 'guard',
              '04': 'talking-tree',
              '05': 'hunter',
              '06': 'goblin',
              '07': 'troll',
              '08': 'fisherman',
              '09': 'messenger',
              '10': 'warrior',
          }

          item_pictures = {
              'Sweets': 'sweets',
              'Old Scroll': 'old-scroll',
              'Magic Branch': 'magic-branch',
              'Horn of Trees': 'horn-of-trees',
              'Bridge Key': 'bridge-key',
              'Golden Medal': 'golden-medal',
              'Mark of Goblins': 'mark-of-goblins',
              'Priclys Feather': 'priclys-feather',
              'Strange Powder': 'strange-powder',
              'Gold Coin': 'gold-coin',
              'Ruby Sword': 'ruby-sword',
              'Staff of Goblins': 'staff-of-goblins',
              'Fishing Rod': 'fishing-rod',
              'Crystal Shard': 'crystal-shard',
              'Blobfish': 'blobfish',
              'Silver Ring': 'silver-ring',
              'Bundle of Letters': 'bundle-of-letters',
              'Scroll with Password': 'scroll-with-password',
              'Old Boots': 'old-boots',
              'Great Salmon': 'great-salmon',
              'Fish': 'fish',
          }

          def add_default_pictures(path):
              text = path.read_text(encoding='utf-8')

              for encounter_id, picture in encounter_pictures.items():
                  field = f'"defaultPicture": "{picture}"'
                  if field in text:
                      continue
                  needle = f'    "{encounter_id}": {{\n'
                  if needle not in text:
                      raise SystemExit(f'{path}: encounter {encounter_id} not found')
                  text = text.replace(
                      needle,
                      needle + f'      "defaultPicture": "{picture}",\n',
                      1,
                  )

              for item_name, picture in item_pictures.items():
                  field = f'"defaultPicture": "{picture}"'
                  if field in text:
                      continue
                  needle = f'    "{item_name}": {{\n'
                  if needle not in text:
                      raise SystemExit(f'{path}: item {item_name} not found')
                  text = text.replace(
                      needle,
                      needle + f'      "defaultPicture": "{picture}",\n',
                      1,
                  )

              path.write_text(text, encoding='utf-8')

          add_default_pictures(Path('data/game-data_en.js'))
          add_default_pictures(Path('data/game-data_hu.js'))

          index = Path('index.html')
          index.write_text(index.read_text(encoding='utf-8').replace('?v=9', '?v=10'), encoding='utf-8')

          loader = Path('language-loader.js')
          loader.write_text(loader.read_text(encoding='utf-8').replace('?v=9', '?v=10'), encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace('qr-city-quest-v9', 'qr-city-quest-v10')
          sw_text = sw_text.replace('?v=9', '?v=10')
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check language-loader.js
          node --check data/game-data_en.js
          node --check data/game-data_hu.js
          node --check sw.js

      - name: Commit restored image system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js data/game-data_en.js data/game-data_hu.js index.html language-loader.js sw.js
          git commit -m "Restore image rendering on categorized app"
          git push
