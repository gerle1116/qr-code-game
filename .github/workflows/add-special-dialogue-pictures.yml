name: Add special dialogue pictures

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-special-dialogue-pictures.yml

permissions:
  contents: write

jobs:
  update-game-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add page picture overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          PICTURES = {
              "0103": "child-back",
              "0107": "child-gone",
              "0202": "merchant-choice-items",
              "0204": "merchant-asking-hand",
              "0205": "merchant-asking-hand",
              "0206": "merchant-reading-list",
              "0207": "merchant-offers-sweets",
              "0209": "merchant-offers-scroll",
              "0212": "merchant-asking-hand",
              "0302": "guard-map-village-center",
              "0304": "guard-map-sections",
              "0305": "guard-troll-sketch",
              "0310": "guard-delighted",
              "0407": "talking-tree-magic-branch",
              "0409": "talking-tree-horn-hole",
              "0504": "hunter-points-trees",
              "0506": "hunter-points-fountain",
              "0509": "hunter-points-footprints",
              "0513": "hunter-gives-medal",
              "0606": "goblin-items-on-ground",
              "0607": "goblin-holds-gold-coin",
              "0608": "goblin-holds-lucky-pebble",
              "0609": "goblin-holds-ruby-sword",
              "0610": "goblin-holds-powder-sack",
              "0611": "goblin-empty-hand",
              "0612": "goblin-holds-powder-sack",
              "0613": "goblin-holds-ruby-sword",
              "0614": "goblin-holds-gold-coin",
              "0616": "goblin-holds-staff-of-goblins",
              "0618": "goblin-tent-by-tree",
              "0703": "troll-blocks-bridge",
              "0706": "troll-holds-key",
              "0707": "troll-sits-by-bridge",
              "0802": "fisherman-points-direction",
              "0804": "fisherman-gives-rod",
              "0810": "fisherman-empty-hand",
              "0815": "fisherman-gives-small-fish",
              "0816": "fisherman-sits-on-dock",
              "0903": "messenger-open-gloved-hands",
              "0905": "messenger-delighted-letters",
              "0907": "messenger-delighted-fish",
              "1002": "warrior-arms-crossed",
              "1004": "warrior-holds-sword",
              "1007": "warrior-open-gate-side",
              "1008": "warrior-holds-sword",
              "1009": "warrior-defeated-weaponless",
          }

          files = [
              Path("data/game-data_en.js"),
              Path("data/game-data_hu.js"),
          ]

          def add_picture_fields(path: Path):
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              out = []
              seen = set()
              i = 0

              while i < len(lines):
                  line = lines[i]
                  out.append(line)
                  match = re.match(r'^(\s*)"id": "(\d{4})",\s*$', line)
                  if match and match.group(2) in PICTURES:
                      indent, page_id = match.groups()
                      picture_line = f'{indent}"picture": "{PICTURES[page_id]}",'
                      seen.add(page_id)

                      if i + 1 < len(lines) and re.match(r'^\s*"picture":\s*"[^"]+",\s*$', lines[i + 1]):
                          out.append(picture_line)
                          i += 2
                          continue
                      else:
                          out.append(picture_line)
                  i += 1

              missing = sorted(set(PICTURES) - seen)
              if missing:
                  raise SystemExit(f"{path}: missing page IDs: {missing}")

              updated = "\n".join(out) + ("\n" if text.endswith("\n") else "")

              if path.name == "game-data_en.js":
                  old = '"text": "Here take this Gold Coin I found. This treasure looks especially good."'
                  new = '"text": "Here! take this lucky Pebble"'
              else:
                  old = '"text": "Tessék, vidd ezt az aranyérmét, amit találtam. Ez a kincs különösen jól néz ki."'
                  new = '"text": "Tessék! Vidd ezt a szerencsekavicsot."'

              if old in updated:
                  updated = updated.replace(old, new, 1)
              elif new not in updated:
                  raise SystemExit(f"{path}: could not find the expected 0608 text")

              path.write_text(updated, encoding="utf-8")

          for file_path in files:
              add_picture_fields(file_path)

          # Validate every special page and make sure picture IDs intentionally omit .png,
          # because app.js resolves them as ./images/${picture}.png.
          for file_path in files:
              text = file_path.read_text(encoding="utf-8")
              for page_id, picture in PICTURES.items():
                  pattern = rf'"id": "{page_id}",\n\s+"picture": "{re.escape(picture)}",'
                  if not re.search(pattern, text):
                      raise SystemExit(f"{file_path}: validation failed for {page_id} -> {picture}")

          print(f"Added/updated {len(PICTURES)} special page picture overrides in both language files.")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- data/game-data_en.js data/game-data_hu.js; then
            echo "No changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-data_en.js data/game-data_hu.js
          git commit -m "Add special dialogue picture overrides"
          git push origin main
