name: Fix one-time item QR pickups

on:
  push:
    paths:
      - ".github/workflows/fix-one-time-item-qr.yml"

permissions:
  contents: write

jobs:
  fix-one-time-item-qr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch item QR pickup logic and translations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("app.js")
          en_path = Path("data/apptext_en.js")
          hu_path = Path("data/apptext_hu.js")

          app = app_path.read_text(encoding="utf-8")
          en = en_path.read_text(encoding="utf-8")
          hu = hu_path.read_text(encoding="utf-8")

          old_block = '''    if (item) {
              if (
                !save.inventory.includes(
                  item.name
                )
              ) {
                save.inventory.push(
                  item.name
                );

                persist();

                toast(
                  TEXT.itemAddedToInventory(
                    getItemDisplayName(
                      item.name
                    )
                  )
                );
              }

              openItemDialogue(
                item.name
              );
            }
          }'''

          # The actual file uses four-space indentation at the scan branch.
          old_block = '''    if (item) {
      if (
        !save.inventory.includes(
          item.name
        )
      ) {
        save.inventory.push(
          item.name
        );

        persist();

        toast(
          TEXT.itemAddedToInventory(
            getItemDisplayName(
              item.name
            )
          )
        );
      }

      openItemDialogue(
        item.name
      );
    }
  }'''

          new_block = '''    if (item) {
      const ownsItem =
        save.inventory.includes(
          item.name
        );

      const hadItemBefore =
        save.hadItems.includes(
          item.name
        );

      // First-ever acquisition from a physical item QR.
      // Keep hadItems as the permanent collection history.
      if (!hadItemBefore) {
        if (!ownsItem) {
          save.inventory.push(
            item.name
          );
        }

        save.hadItems.push(
          item.name
        );

        persist();

        if (!ownsItem) {
          toast(
            TEXT.itemAddedToInventory(
              getItemDisplayName(
                item.name
              )
            )
          );
        }

        openItemDialogue(
          item.name
        );
        return;
      }

      // Already collected and still owned: allow normal item use,
      // but never create a duplicate copy.
      if (ownsItem) {
        openItemDialogue(
          item.name
        );
        return;
      }

      // Already collected but later consumed/traded/lost:
      // the physical QR cannot be used to reclaim the item.
      showHome();
      toast(
        TEXT.itemAlreadyCollected
      );
      return;
    }
  }'''

          if "const hadItemBefore =" not in app:
              count = app.count(old_block)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one item QR pickup block, found {count}"
                  )
              app = app.replace(old_block, new_block, 1)

          en_anchor = (
              '  itemAddedToInventory: itemName => `${itemName} added to inventory.`,\n'
          )
          en_line = (
              '  itemAlreadyCollected: "You have already collected this item.",\n'
          )
          if "itemAlreadyCollected:" not in en:
              if en_anchor not in en:
                  raise SystemExit("English item text anchor not found")
              en = en.replace(en_anchor, en_anchor + en_line, 1)

          hu_anchor = (
              '  itemAddedToInventory: itemName => `${itemName} bekerült a tárgyaid közé.`,\n'
          )
          hu_line = (
              '  itemAlreadyCollected: "Ezt a tárgyat már begyűjtötted.",\n'
          )
          if "itemAlreadyCollected:" not in hu:
              if hu_anchor not in hu:
                  raise SystemExit("Hungarian item text anchor not found")
              hu = hu.replace(hu_anchor, hu_anchor + hu_line, 1)

          required_app_markers = [
              "const ownsItem =",
              "const hadItemBefore =",
              "save.hadItems.push(",
              "TEXT.itemAlreadyCollected",
              'case "ADD_ITEM":',
          ]
          for marker in required_app_markers:
              if marker not in app:
                  raise SystemExit(f"Missing final app marker: {marker}")

          if 'itemAlreadyCollected: "You have already collected this item."' not in en:
              raise SystemExit("English already-collected text missing")
          if 'itemAlreadyCollected: "Ezt a tárgyat már begyűjtötted."' not in hu:
              raise SystemExit("Hungarian already-collected text missing")

          app_path.write_text(app, encoding="utf-8")
          en_path.write_text(en, encoding="utf-8")
          hu_path.write_text(hu, encoding="utf-8")
          PY

      - name: Validate JavaScript and targeted behavior markers
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check data/apptext_en.js
          node --check data/apptext_hu.js
          grep -q 'const hadItemBefore =' app.js
          grep -q 'TEXT.itemAlreadyCollected' app.js
          grep -q 'case "ADD_ITEM"' app.js
          grep -q 'itemAlreadyCollected:' data/apptext_en.js
          grep -q 'itemAlreadyCollected:' data/apptext_hu.js
          git diff --check

      - name: Commit one-time QR pickup fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js data/apptext_en.js data/apptext_hu.js
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Prevent reclaiming consumed QR items"
          git push
