name: Mod system regression tests
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'app.js'
      - 'language-loader.js'
      - 'mod-system/**'
      - 'tests/test-mod-installer.js'
      - 'tests/test-mod-runtime.js'
      - 'tests/test-mod-localization.js'
      - 'tests/test-mod-localization.js'
      - '.github/workflows/mod-installer-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'language-loader.js'
      - 'mod-system/**'
      - 'tests/test-mod-installer.js'
      - 'tests/test-mod-runtime.js'
      - '.github/workflows/mod-installer-tests.yml'
  workflow_dispatch:
jobs:
  mod-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ZIP importer and mod manager
        run: node tests/test-mod-installer.js
      - name: Verify playable expansion engine
        run: node tests/test-mod-runtime.js
      - name: Verify dynamic main-game and independent translations
        run: node tests/test-mod-localization.js
